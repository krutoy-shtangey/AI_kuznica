# Temporary HTTP vhost for ACME before the certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/reglament-acme;
        try_files $uri =404;
    }
    location / { return 404; }
}
