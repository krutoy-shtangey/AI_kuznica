# Include in the nginx http context through sites-enabled.
limit_req_zone $binary_remote_addr zone=reglament_api:10m rate=120r/m;
map $request_method $reglament_write_key {
    default "";
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
    PATCH $binary_remote_addr;
}
limit_req_zone $reglament_write_key zone=reglament_writes:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/reglament-acme;
        try_files $uri =404;
    }
    location / { return 308 https://__DOMAIN__$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16k;
    access_log off;
    limit_req_status 429;
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream off;
    proxy_hide_header X-Robots-Tag;
    proxy_read_timeout 90s;

    location = / { proxy_pass http://127.0.0.1:8000; }
    location ^~ /assets/ { proxy_pass http://127.0.0.1:8000; }
    location = /robots.txt { proxy_pass http://127.0.0.1:8000; }

    # The SMTP link uses Swagger. Administrative API operations retain Bearer auth.
    location = /docs { proxy_pass http://127.0.0.1:8000; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8000; }

    location ^~ /api/ {
        limit_req zone=reglament_api burst=20 nodelay;
        limit_req zone=reglament_writes burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location / { return 404; }
}
